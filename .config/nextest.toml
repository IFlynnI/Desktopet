# The e2e tests use the real screen, so they run one at a time. `cargo e2e-quiet` runs the ones that leave the
# mouse alone, and `cargo e2e` runs them all.
[profile.default]
default-filter = "not binary(e2e)"

[test-groups]
desktop = { max-threads = 1 }

[[profile.default.overrides]]
filter = "binary(e2e)"
test-group = "desktop"
slow-timeout = { period = "60s", terminate-after = 2 }

[profile.e2e]
default-filter = "binary(e2e)"

[profile.e2e-quiet]
default-filter = "binary(e2e) & test(/^quiet::/)"
