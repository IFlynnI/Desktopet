[package]
name = "pet-app"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Desktop Pet: the running program."

[[bin]]
name = "desktop-pet"
path = "src/main.rs"

# The e2e tests take over the real mouse, so they only build when asked for: run them with `cargo e2e`.
[[test]]
name = "e2e"
path = "tests/e2e/main.rs"
required-features = ["e2e"]

[features]
e2e = []

[dependencies]
pet-core.workspace = true
pet-platform.workspace = true
bevy.workspace = true

[target.'cfg(windows)'.dev-dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
