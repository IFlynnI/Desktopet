# Four mistakes under different rules, so a test can show every one is reported.
format_version = 1
name = "Broken on purpose"
starting_form = "egg"                     # there's no Form called egg

[forms.hatchling]
cell = { width = 24, height = 18 }
anchor = { x = 12, y = 18 }
body = { x = -9, y = -15, width = 18, height = 15 }
default_action = "idle"

[forms.hatchling.actions.idle]
animation = "idle"

[forms.hatchling.actions.sleep]
animation = "sleep"

[forms.hatchling.animations.idle]
sheet = "hatchling/idle.png"              # saved with no transparency
durations_ms = [250, 250]

[forms.hatchling.animations.sleep]
sheet = "hatchling/sleep.png"             # there's no such file
durations_ms = [600, 0, 600]              # a Frame of 0 ms
