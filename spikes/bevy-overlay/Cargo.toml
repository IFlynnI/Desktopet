[package]
name = "bevy-overlay"
version = "0.1.0"
edition = "2024"
publish = false
description = "THROWAWAY platform spike: transparent click-through Bevy overlay on Windows (see docs/PRD.md §7.1)"

[dependencies]
bevy = { version = "0.20", default-features = false, features = [
    "default_app",
    "std",
    "bevy_winit",
    "multi_threaded",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_camera",
    "bevy_image",
    "bevy_window",
    "bevy_sprite",
    "bevy_sprite_render",
    "png",
] }
image = { version = "0.25", default-features = false, features = ["png"] }
raw-window-handle = "0.6"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
